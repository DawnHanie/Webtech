<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scrollbar-gutter: stable;
}

body {
    display: flex;
    flex-direction: column;

    min-height: 100vh;
    margin: 0;

    background: linear-gradient(
        145deg,
        #454545,
        #303030,
        #1a1a1a
    );

    background-attachment: fixed;

    color: white;
    font-family: 'Inter', Arial, sans-serif;
    line-height: 1.7;
}

h1, h2, h3 {
    font-family: 'Outfit', Arial, sans-serif;
    line-height: 1.2;
}


header {
    flex-shrink: 0;
    padding: 35px 5% 15px;
}

header h1 {
    margin: 0;

    font-size: 34px;
    font-weight: 800;
    color: #cccccc;
}

nav {
    position: fixed;
    top: 30px;
    right: 5%;
    left: auto;

    display: flex;
    justify-content: flex-end;
    align-items: center;
    flex-wrap: nowrap;

    gap: 14px;

    width: max-content;
    max-width: 90%;

    margin: 0;
    padding: 8px 0;

    color: #cccccc;
    font-family: 'Inter', Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;

    white-space: nowrap;
    z-index: 100;
}

nav a {
    display: inline-block;
    flex-shrink: 0;

    color: #cccccc;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;

    transition:
        color 0.3s ease,
        text-shadow 0.3s ease;
}

nav a:hover {
    color: white;
    background: transparent;

    text-shadow:
        0 0 10px rgba(255, 255, 255, 0.8),
        0 0 20px rgba(255, 255, 255, 0.4);
}

nav a:focus-visible {
    outline: 2px solid white;
    outline-offset: 5px;
}

main {
    flex: 1;

    width: 90%;
    max-width: 1100px;

    margin: 45px auto 0;
    padding-bottom: 50px;
}

form {
    display: block;

    width: 100%;
    max-width: 650px;

    margin: 0 auto;
    padding: 20px 0;

    text-align: left;
}

form br {
    display: none;
}

form label {
    display: block;

    margin: 18px 0 8px;

    color: #eeeeee;
    font-size: 16px;
    font-weight: 600;
}

form input[type="text"],
form input[type="email"],
form textarea {
    display: block;

    width: 100%;
    max-width: 100%;

    margin-bottom: 20px;
    padding: 14px 15px;

    background: #303030;
    color: white;

    border: 1px solid #777777;
    border-radius: 8px;

    font-family: 'Inter', Arial, sans-serif;
    font-size: 16px;

    transition:
        border-color 0.3s ease,
        box-shadow 0.3s ease;
}

form input:focus-visible,
form textarea:focus-visible {
    outline: 2px solid #dddddd;
    outline-offset: 2px;
}

form input::placeholder,
form textarea::placeholder {
    color: #999999;
}

form textarea {
    min-height: 150px;
    resize: vertical;
}

form input[type="submit"] {
    display: block;

    margin: 30px auto 0;
    padding: 14px 40px;

    background: #cccccc;
    color: #222222;

    border: none;
    border-radius: 8px;

    font-family: 'Inter', Arial, sans-serif;
    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    transition:
        background 0.3s ease,
        transform 0.3s ease;
}

form input[type="submit"]:hover {
    background: white;
    transform: translateY(-2px);
}

footer {
    flex-shrink: 0;

    width: 100%;
    margin: 0;

    padding: 30px 20px;

    background: rgba(15, 15, 15, 0.45);
    border-top: 1px solid #505050;

    color: #aaaaaa;
    text-align: center;
}

footer p {
    margin: 0;

    font-size: 14px;
    line-height: 1.6;
}

@media (max-width: 950px) {

    header h1 {
        font-size: 28px;
    }

    nav {
        gap: 9px;
        font-size: 13px;
    }

    nav a {
        font-size: 13px;
    }

    main {
        width: 90%;
    }
}

@media (max-width: 650px) {

    header {
        padding: 100px 5% 15px;
    }

    header h1 {
        font-size: 28px;
    }

    nav {
        top: 15px;
        right: 5%;

        max-width: 90%;

        flex-wrap: wrap;
        gap: 8px;

        font-size: 12px;
        white-space: normal;
    }

    nav a {
        font-size: 12px;
    }

    main {
        width: 94%;

        margin: 25px auto 0;
        padding-bottom: 35px;
    }

    form {
        padding: 10px 0;
    }

    form label {
        font-size: 14px;
    }

    form input[type="text"],
    form input[type="email"],
    form textarea {
        font-size: 14px;
    }

    footer {
        width: 100%;
        padding: 25px 15px;
    }

    footer p {
        font-size: 13px;
    }
}

    </style>
    <header>
    <nav>
        <a href="index.html">HOME</a> |
        <a href="about.html">ABOUT</a> |
        <a href="education.html">EDUCATION</a> |
        <a href="skills.html">SKILLS</a> |
        <a href="contact.html">CONTACT</a>
    </nav>
        <h1>Contact</h1>
    </header>
<main>
    <form action="">
    <label for="name">Name:</label>
    <input type="text" name="name" id="name" placeholder="Enter your name" required>
    <br>
    <br>
    <label for="email">Email:</label>
    <input type="email" name="email" id="email" required placeholder="Enter your email">
    <br>
    <br>
    <label for="message">Message:</label>
    <br>
    <textarea name="message" id="message" rows="4" cols="40" required placeholder="Enter your message"></textarea>
    <br>
    <br>
    <input type="submit" value="Submit">
    </form>
</main>
    <footer>
        <p>My Personal Website | 2026</p>
    </footer>
</body>
</html>
