<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap');


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scrollbar-gutter: stable;
}

body {
    min-height: 100vh;

    background: linear-gradient(
        145deg,
        #454545 0%,
        #303030 50%,
        #1a1a1a 100%
    );

    background-attachment: fixed;

    color: white;
    font-family: 'Inter', Arial, sans-serif;
    line-height: 1.7;
}

h1,
h2,
h3 {
    font-family: 'Outfit', Arial, sans-serif;
    line-height: 1.2;
}

header {
    width: 100%;
    padding: 35px 5% 15px;
}

header h1 {
    margin: 0;

    font-size: 34px;
    font-weight: 800;
    color: #cccccc;

    text-align: left;
}

nav {
    position: fixed;
    top: 30px;
    right: 5%;
    left: auto;

    display: flex;
    justify-content: flex-end;
    align-items: center;
    flex-wrap: nowrap;

    gap: 14px;

    width: max-content;
    max-width: 90%;

    margin: 0;
    padding: 8px 0;

    color: #cccccc;
    font-family: 'Inter', Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;

    white-space: nowrap;
    z-index: 100;
}

nav a {
    display: inline-block;
    flex-shrink: 0;

    color: #cccccc;
    font-size: 15px;
    font-weight: 500;

    text-decoration: none;
    white-space: nowrap;

    transition:
        color 0.3s ease,
        text-shadow 0.3s ease;
}

nav a:hover {
    color: #ffffff;

    text-shadow:
        0 0 10px rgba(255, 255, 255, 0.8),
        0 0 20px rgba(255, 255, 255, 0.4);
}

nav a:focus-visible {
    outline: 2px solid white;
    outline-offset: 5px;
}

main {
    width: 90%;
    max-width: none;

    margin: 25px 5% 70px;
    padding: 0;

    text-align: left;
}

main > section {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        340px;

    grid-template-rows: auto auto;

    align-content: center;
    align-items: center;

    column-gap: 55px;
    row-gap: 15px;

    width: 100%;
    min-height: 570px;

    margin: 0;
    padding: 40px 0;

    text-align: left;
}

main > section > p:first-of-type {
    grid-column: 1;
    grid-row: 1;

    justify-self: start;
    align-self: end;

    width: 100%;
    margin: 0;

    font-family: 'Outfit', Arial, sans-serif;
    font-size: clamp(32px, 4vw, 50px);
    font-weight: 800;
    line-height: 1.3;

    color: #999999;
    text-align: left;
}

main > section > p:nth-of-type(2) {
    grid-column: 1;
    grid-row: 2;

    justify-self: start;
    align-self: start;

    width: 100%;
    margin: 0;

    font-size: clamp(20px, 2vw, 26px);
    font-weight: 700;

    color: #ffffff;
    text-align: left;
}

main > section > img {
    grid-column: 2;
    grid-row: 1 / 3;

    justify-self: end;
    align-self: center;

    display: block;

    width: 300px;
    height: 470px;
    max-width: 100%;

    margin: 0;

    object-fit: cover;
    object-position: center;

    border-radius: 50%;
    border: none;
}

main > article {
    display: block;

    width: 100%;
    max-width: none;

    margin: 20px 0 40px;
    padding: 35px 40px;

    background: rgba(20, 20, 20, 0.35);

    border: 1px solid #505050;
    border-radius: 14px;

    text-align: left;
}

main > article h2 {
    margin-bottom: 15px;

    font-size: 30px;
    font-weight: 700;

    color: #dddddd;
    text-align: left;
}

main > article p {
    margin-bottom: 15px;

    font-size: 17px;
    line-height: 1.8;

    color: #dddddd;
    text-align: left;
}

main > article img {
    max-width: 100%;
    height: auto;

    border-radius: 10px;
}

main > article video {
    display: block;

    width: 500px;
    max-width: 100%;
    height: auto;

    margin: 20px 0;

    border-radius: 10px;
}

main > article a {
    display: inline-block;

    margin-top: 10px;

    color: #dddddd;
    text-decoration: underline;
    text-underline-offset: 4px;

    transition: color 0.3s ease;
}

main > article a:hover {
    color: white;
}

footer {
    width: 100%;
    margin: 0;
    padding: 30px 20px;

    background: rgba(15, 15, 15, 0.45);

    border-top: 1px solid #505050;

    color: #aaaaaa;
    text-align: center;
}

footer p {
    margin: 0;
    font-size: 14px;
}

@media (max-width: 950px) {

    header h1 {
        max-width: 45%;
        font-size: 28px;
    }

    nav {
        gap: 9px;
        font-size: 13px;
    }

    nav a {
        font-size: 13px;
    }

    main {
        width: 90%;
        margin-left: 5%;
        margin-right: 5%;
    }

    main > section {
        grid-template-columns:
            minmax(0, 1fr)
            250px;

        column-gap: 25px;
    }

    main > section > img {
        width: 240px;
        height: 380px;
    }

    main > article {
        padding: 30px;
    }
}


@media (max-width: 650px) {

    header {
        padding: 100px 5% 15px;
    }

    header h1 {
        max-width: 100%;
        font-size: 28px;
    }

    nav {
        top: 15px;
        right: 5%;

        max-width: 90%;

        flex-wrap: wrap;
        gap: 8px;

        font-size: 12px;
        white-space: normal;
    }

    nav a {
        font-size: 12px;
    }

    main {
        width: 90%;
        margin: 25px 5% 50px;
        padding: 0;
    }

    main > section {
        display: flex;
        flex-direction: column;
        align-items: flex-start;

        width: 100%;
        min-height: auto;

        padding: 45px 0;
        gap: 18px;
    }

    main > section > p:first-of-type {
        width: 100%;

        font-size: 34px;
        text-align: left;
    }

    main > section > p:nth-of-type(2) {
        width: 100%;

        font-size: 21px;
        text-align: left;
    }

    main > section > img {
        align-self: flex-end;

        width: 230px;
        height: 360px;

        margin-top: 20px;
    }

    main > article {
        width: 100%;

        margin: 20px 0;
        padding: 25px 20px;
    }

    main > article h2 {
        font-size: 26px;
    }

    main > article p {
        font-size: 15px;
    }

    footer {
        padding: 25px 15px;
    }

    footer p {
        font-size: 13px;
    }
}

    </style>
    <header>
        <h1>My Mini Portfolio Website</h1>
         <nav>
        <a href="index.html">HOME</a> |
        <a href="about.html">ABOUT</a> |
        <a href="education.html">EDUCATION</a> |
        <a href="skills.html">SKILLS</a> |
        <a href="contact.html">CONTACT</a>
    </nav>
    </header>
   
    <main>
        <section>
            <p>Hi! I'm Hanna Nicole Macalino</p>
            <p>Welcome to my Mini Portfolio Website!</p>
            <img src="images/profile.jpg" alt="Profile photo" width="200" height="350">
        </section>

        <article>
            <h2>My Portfolio Project</h2>
            <p>This website showcases my personal information, education, skills, and interest.</p>
        </article>
    </main>

    <footer>
        <p>My Personal Portfolio | 2026</p>
    </footer>

</body>
</html>
