<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatting</title>
</head>
<body>
    <p>
        <strong>HTML</strong> stands for 
        <em>HyperText Markup Language</em>.
        <i>This is italic.</i>
        <ul>This text has underline</ul>
        <mark>This is highlighted/marked text</mark>
        <small>This message is small</small>
        <del>This is how delete looks like</del>
        <ins>This is Inserted</ins>
        <sub>This is Subscript</sub>
        <sup>This is Superscript</sup>

        <h2>Challenge</h2>
        <p>H<sub>2</sub>O</p>
        <p>E = mc<sup>2</sup></p>
    </p>
</body>
</html>
