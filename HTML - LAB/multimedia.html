<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
</head>
<body>
    <!-- Task -->
     <h1>HTML Multimedia</h1>
     <h2>Image</h2>
     <img src="images/profile.jpg" alt="My Profile" width="250">

     </video>
     <h2>Educational Video</h2>
     <iframe width="560" height="315" src="https://www.youtube.com/embed/HD13eq_Pmp8" frameborder="0" title="HTML Tutorial" allowfullscreen></iframe>

      
</body>
