<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <!-- Demo -->
     <input type="text" name="" id="">
     <input type="email" name="" id="">
     <input type="password" name="" id="">
     <input type="checkbox" name="" id="">
     <input type="radio" name="" id="">
     <input type="submit" value="">

     <!-- Form Challenge -->
      <form action="">
      <h2>Student Registration Form</h2>
      <label for="studentid">Student ID:</label>
      <input type="text" name="studentid" id="studentid">
      <br>
      <br>
      <label for="fullname">Full Name:</label>
      <input type="text" name="fullname" id="fullname">
      <br>
      <br>
      <label for="email">Email:</label>
      <input type="email" name="email" id="email">
      <br>
      <br>
      <label for="password">Password:</label> 
      <input type="pasword" name="password" id="password">
      <br>
      <br>
      <label for="gender">Gender</label>
      <br>
      <input type="radio" name="male" id="male" value="male">
      <label for="male">Male</label>
      <br>
      <input type="radio" name="female" id="female" value="female">
      <label for="female">Female</label>    
      <br>
      <input type="radio" name="nottosay" id="nottosay" value="nottosay">
      <label for="nottosay">Prefer not to say</label> 
      <br>
      <br>
      <label for="course">Course</label>
      <br>
      <input type="radio" name="bsit" id="bsit" value="bsit">
      <label for="bsit">BSIT</label>
      <br>
      <input type="radio" name="bscs" id="bscs" value="bscs">
      <label for="bscs">BSCS</label>
      <br>
      <input type="radio" name="bmma" id="bmma" value="bmma">
      <label for="bmma">BMMA</label>
      <br>
      <br>
      <label for="hobbies">Hobbies</label>
      <br>
      <input type="checkbox" name="gaming" id="gaming">
      <label for="gaming">Gaming</label>
      <input type="checkbox" name="reading" id="reading">
      <label for="reading">Reading</label>
      <br>
      <input type="checkbox" name="watching" id="watching">
      <label for="watching">Watching Movies and Series</label>
      <input type="checkbox" name="drawing" id="drawing">
      <label for="drawing">Drawing</label>
      <br>
      <br>
      <label for="address">Address:</label>
      <input type="text" name="address" id="address">
      <br>
      <br>
      <input type="submit" value="Submit">
      </form>
</body>
</html>
